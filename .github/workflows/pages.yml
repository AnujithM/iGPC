name: Publish project site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site and verified browser build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p _site/assets/rail-lab "$RUNNER_TEMP/rail-build"
          cp index.html styles.css script.js .nojekyll LICENSE CITATION.cff README.md _site/
          cp -a assets/. _site/assets/
          gh release download rail-e250-web-v1 --repo "$GITHUB_REPOSITORY" --pattern 'rail-e250.tar.part*' --dir "$RUNNER_TEMP/rail-build"
          pieces=("$RUNNER_TEMP"/rail-build/rail-e250.tar.part[0-9][0-9])
          test "${#pieces[@]}" -eq 14
          cat "${pieces[@]}" > "$RUNNER_TEMP/rail.tar"
          echo "2a419c3442b465110a410a6d913454809c4d252590e960683b88611ee2782cda  $RUNNER_TEMP/rail.tar" | sha256sum --check --status
          tar --no-same-owner --no-same-permissions -xf "$RUNNER_TEMP/rail.tar" -C _site/assets/rail-lab
          lab=_site/assets/rail-lab
          jq -e '.policy == "rail-expert-e250" and .maxHorizontalPushMps == 1.5' "$lab/release.json"
          jq -e '.policy == "rail-expert-e250" and (.shards | length == 41)' "$lab/runtime/expert/gpu32/weights.json"
          test -f "$lab/runtime/expert/models/features/manifest.json"
          test -f "$lab/runtime/rail_expert_tab.mjs"
          test -s "$lab/runtime/cpu_dense.wasm"
          test -s "$lab/runtime/rail_cpu_prior.mjs"
          test -s "$lab/runtime/rail_cpu_worker.mjs"
          test -s "$lab/runtime/rail_cpu_core.mjs"
          test ! -e "$lab/runtime/models/sensors"
          test ! -e "$lab/runtime/rail_standalone.mjs"
          test "$(du -sb _site | cut -f1)" -lt 1000000000
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
