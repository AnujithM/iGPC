name: Publish project site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Fetch the pinned, finished playground (read only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: AnujithM/iGPC-rail-playground
          ref: 65d8f417f07bd6796c0350770016f0bd94e25245
          ssh-key: ${{ secrets.RAIL_BUILD_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: _rail_distribution
      - name: Assemble site and verified browser build
        shell: bash
        run: |
          set -euo pipefail
          lab=_site/assets/rail-lab
          mkdir -p "$lab"
          cp index.html styles.css script.js .nojekyll LICENSE CITATION.cff README.md _site/
          rsync -a --exclude='/rail-lab/' assets/ _site/assets/
          # Export only the approved static tree, never repository metadata or development files.
          test "$(git -C _rail_distribution rev-parse HEAD:rail-lab)" = 21dce329bddeb1225bb7d41f7b43ef9370c4ba6c
          git -C _rail_distribution archive HEAD:rail-lab | tar --no-same-owner --no-same-permissions -xf - -C "$lab"
          jq -e '.policy == "rail-expert-e250" and .maxHorizontalPushMps == 1.5' "$lab/release.json"
          jq -e '.policy == "rail-expert-e250" and (.shards | length == 41)' "$lab/runtime/expert/gpu32/weights.json"
          test -f "$lab/runtime/expert/models/features/manifest.json"
          test -f "$lab/runtime/rail_expert_tab.mjs"
          test -s "$lab/runtime/cpu_dense.wasm"
          test -s "$lab/runtime/rail_cpu_prior.mjs"
          test -s "$lab/runtime/rail_cpu_worker.mjs"
          test -s "$lab/runtime/rail_cpu_core.mjs"
          test ! -e "$lab/runtime/models/sensors"
          test ! -e "$lab/runtime/rail_standalone.mjs"
          test "$(du -sb _site | cut -f1)" -lt 1000000000
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
